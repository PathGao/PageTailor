<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PageTailor</title>
    <style>
      :root {
        --bg: #f5f5f7; --group: #fff; --text: #1d1d1f; --text-2: #6e6e73; --sep: rgb(0 0 0 / 0.08);
        --on: #34c759; --off: #e9e9ea; --knob: #fff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #000; --group: #1c1c1e; --text: #f5f5f7; --text-2: #8e8e93; --sep: rgb(255 255 255 / 0.1); --off: #39393d; }
      }
      body {
        margin: 0; padding: 16px; width: 300px; background: var(--bg); color: var(--text);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1 { margin: 2px 4px 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      .group { background: var(--group); border-radius: 12px; overflow: hidden; }
      label { display: flex; align-items: center; gap: 12px; padding: 11px 14px; cursor: pointer; }
      label + label { border-top: 0.5px solid var(--sep); }
      label span { flex: 1; }
      input { appearance: none; margin: 0; width: 42px; height: 26px; border-radius: 13px; background: var(--off); position: relative; cursor: pointer; transition: background 0.2s; flex: none; }
      input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: 0 2px 4px rgb(0 0 0 / 0.2); transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.4, 1.2); }
      input:checked { background: var(--on); }
      input:checked::after { transform: translateX(16px); }
      input:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
      p { margin: 0; padding: 14px; color: var(--text-2); }
      .warn { margin-top: 12px; background: var(--group); border-radius: 12px; }
      .warn p { padding: 12px 14px 8px; color: var(--text); }
      .warn button { margin: 0 14px 12px; padding: 6px 14px; border: 0; border-radius: 999px; background: #0071e3; color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>PageTailor</h1>
    <div class="group" id="list"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
